# Production stack. Lives on the VPS next to its `.env` (see .env.example);
# the deploy workflow uploads this file and sets the image tags in images.env.
name: football-planner

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  server:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/football-planner-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Requests arrive through Caddy, one hop away
      TRUST_PROXY: '1'
    depends_on:
      # Only with the postgres profile; an external database needs no waiting
      postgres:
        condition: service_healthy
        required: false
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/football-planner-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    logging: *logging

  # Optional local Postgres (COMPOSE_PROFILES=postgres): set POSTGRES_PASSWORD, and
  # DATABASE_URL=postgres://football:<POSTGRES_PASSWORD>@postgres:5432/football
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_DB: football
      # The image refuses to start without it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/<version>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'football', '-d', 'football']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # Daily dump of the database to ./backups, keeps BACKUP_KEEP_DAYS
  postgres-backup:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    profiles: [postgres]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      PGHOST: postgres
      PGUSER: football
      PGDATABASE: football
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./backups:/backup
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backup/football-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$file"; then
            echo "backup written: $$file"
            wait=86400
          else
            rm -f "$$file"
            # e.g. Postgres restarting: try again soon instead of in a day
            echo "backup failed, retrying in 5 minutes" >&2
            wait=300
          fi
          find /backup -name 'football-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$wait"
        done
    logging: *logging

  # Legacy: the local MongoDB of older versions (COMPOSE_PROFILES=postgres,mongo), kept
  # only to move its data to Postgres (deploy/README.md: Moving from MongoDB). Drop the
  # mongo profile once the data is moved; its volume stays until removed by hand.
  mongo:
    image: mongo:${MONGO_VERSION:-8.0.34}
    profiles: [mongo]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Daily gzip dump of the local MongoDB to ./backups, keeps BACKUP_KEEP_DAYS
  mongo-backup:
    image: mongo:${MONGO_VERSION:-8.0.34}
    profiles: [mongo]
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backup
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backup/football-$$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
          if mongodump --uri=mongodb://mongo:27017/football --gzip --archive="$$file"; then
            echo "backup written: $$file"
          else
            echo "backup failed" >&2
          fi
          find /backup -name 'football-*.archive.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  mongo_data:
