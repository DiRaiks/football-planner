# Production stack. Lives on the VPS next to its `.env` (see .env.example);
# the deploy workflow uploads this file and sets the image tags in images.env.
name: football-planner

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  server:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/football-planner-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Requests arrive through Caddy, one hop away
      TRUST_PROXY: '1'
    logging: *logging

  web:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/football-planner-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    logging: *logging

  # Optional local MongoDB: COMPOSE_PROFILES=mongo and
  # MONGO_URI=mongodb://mongo:27017/football. Otherwise point MONGO_URI to Atlas.
  mongo:
    image: mongo:${MONGO_VERSION:-8.0.34}
    profiles: [mongo]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Daily gzip dump of the local MongoDB to ./backups, keeps BACKUP_KEEP_DAYS
  mongo-backup:
    image: mongo:${MONGO_VERSION:-8.0.34}
    profiles: [mongo]
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backup
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backup/football-$$(date -u +%Y%m%dT%H%M%SZ).archive.gz"
          if mongodump --uri=mongodb://mongo:27017/football --gzip --archive="$$file"; then
            echo "backup written: $$file"
          else
            echo "backup failed" >&2
          fi
          find /backup -name 'football-*.archive.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
