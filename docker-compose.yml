version: '3.9'
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HTTPS_PRIVKEY_PATH: ./privkey.pem
      HTTPS_FULLCHAIN_PATH: ./fullchain.pem
    ports:
      - "3000:3000"
      - "443:3000"
    volumes:
      - ./certs:/certs:ro
