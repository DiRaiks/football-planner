name: Deploy

# After CI passes on main: only tested commits reach the server
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The commit CI tested; github.sha is the branch head under workflow_run
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/football-planner-${{ matrix.app }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    # Skipped until the server is configured (see deploy/README.md). DEPLOY_PATH must be
    # a repository variable: variables of the environment are not visible to this check
    if: vars.DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Upload compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.yml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.SHA }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE_REGISTRY,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f .env || { echo ".env is missing in $DEPLOY_PATH"; exit 1; }
            registry=$(echo "$IMAGE_REGISTRY" | tr '[:upper:]' '[:lower:]')
            # compose prefers the shell's variables to --env-file: export the lowercase one
            export IMAGE_REGISTRY="$registry"
            printf 'IMAGE_REGISTRY=%s\nIMAGE_TAG=%s\n' "$registry" "$IMAGE_TAG" > images.env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            compose="docker compose --env-file .env --env-file images.env"
            $compose pull
            $compose up -d --remove-orphans
            docker logout ghcr.io
            # wait for the containers' own health checks
            for service in server web; do
              for attempt in $(seq 1 30); do
                status=$(docker inspect -f '{{.State.Health.Status}}' "$($compose ps -q "$service")")
                [ "$status" = healthy ] && break
                [ "$attempt" = 30 ] && { echo "$service is $status"; $compose logs --tail 50 "$service"; exit 1; }
                sleep 5
              done
              echo "$service is healthy"
            done
            docker image prune -f
