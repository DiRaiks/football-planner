name: Deploy

# After CI passes on main: only tested commits reach the server
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Builds the images, uploads deploy/compose.yml, postgres.env and the shared
  # postgres.compose.yml, restarts the stack and waits for server and web to be healthy.
  # The deploy step is skipped until DEPLOY_PATH is set (see deploy/README.md); it must
  # be a repository variable: variables of the environment are not visible here.
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # The shared workflow pushes the images to GHCR
    permissions:
      contents: read
      packages: write
    uses: DiRaiks/dirai-kit/.github/workflows/deploy.yml@aa9060fca5620c6ca848e6b93a7b311fe914d964 # main
    with:
      # The commit CI tested; github.sha is the branch head under workflow_run
      commit: ${{ github.event.workflow_run.head_sha || github.sha }}
      images: >-
        [{"name": "football-planner-server", "dockerfile": "apps/server/Dockerfile"},
         {"name": "football-planner-web", "dockerfile": "apps/web/Dockerfile"}]
      services: server web
      deploy-path: ${{ vars.DEPLOY_PATH }}
      # The Caddyfile is built into the web image
      files: deploy/compose.yml,deploy/postgres.env
    secrets: inherit
