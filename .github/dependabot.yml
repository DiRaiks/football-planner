# Dependency updates: every ecosystem below goes into one weekly PR (multi-ecosystem
# group). Versions younger than a week are skipped (cooldown); security updates
# come at once, in their own PRs.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow

updates:
  # npm workspaces: the root lockfile covers every package
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories: ['/apps/server', '/apps/web']
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /deploy
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
